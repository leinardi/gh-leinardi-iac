      - name: Run shellcheck via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/shellcheck@68bf8e338b79df404181ceef655ae02f1c8edb8a # v1.0.2
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  tofu-docs:
    # The reviewdog reporters comment on a pull request; there is none to comment on otherwise.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # reviewdog posts its findings as a pull request review, which needs pull-requests: write.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run OpenTofu docs via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/tofu-docs@68bf8e338b79df404181ceef655ae02f1c8edb8a # v1.0.2
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  tofu-fmt:
    # The reviewdog reporters comment on a pull request; there is none to comment on otherwise.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # reviewdog posts its findings as a pull request review, which needs pull-requests: write.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run OpenTofu fmt via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/tofu-fmt@68bf8e338b79df404181ceef655ae02f1c8edb8a # v1.0.2
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  tofu-tflint:
    # The reviewdog reporters comment on a pull request; there is none to comment on otherwise.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # reviewdog posts its findings as a pull request review, which needs pull-requests: write.
    permissions:
